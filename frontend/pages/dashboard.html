<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="../styles/style.css" />
</head>

<body class="dashboard-body">
  <div class="dashboard-layout">

    <aside class="sidebar">
      <ul>
        <li>Home</li>
        <li id="postsList">Posts</li>
        <li>Logout</li>
      </ul>
    </aside>

    <main class="dashboard-content">
      <h1>Dashboard</h1>
      <p>Welcome to your dashboard</p>

      <div class="card" id="postsCard">
        <h3>Create Post</h3>
        <textarea id="postBody" placeholder="Write your post..."></textarea>
        <button id="postBtn">Post</button>
        <p id="post-message" class="message"></p>
      </div>
    </main>
  </div>
  <script type="module" src="../scripts/site.js"></script>
</body>

</html>
